[project]
name = "atlas-gen"
version = "0.1.0"
description = "Generates graph.json + docs.json from the clockmost infra repo (overlay.yaml, docs/)"
requires-python = ">=3.15"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.26", "pydantic>=2.13", "markdown-it-py>=4.2"]

[project.scripts]
atlas-gen = "atlas_gen.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_gen"]

# schemas/ lives once at the repo root; the sdist carries a copy inside the package (the Dockerfile does the same),
# and the wheel, built from that sdist by `uv build`, picks it up with the rest of src/atlas_gen
[tool.hatch.build.targets.sdist.force-include]
"../../schemas" = "src/atlas_gen/schemas"
