name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    # needs node for the JS actions (checkout, setup-uv): the uv image has none
    container: { image: "catthehacker/ubuntu:act-latest" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - run: uv sync --frozen --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    container: { image: "node:22-alpine" }
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: cd .. && apk add --no-cache bash grep >/dev/null && ./scripts/secret-scan.sh

  publish-generator:
    # atlas-gen -> Gitea's PyPI registry, so the infra repo's CI can `uvx atlas-gen`.
    needs: [python, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container: { image: "catthehacker/ubuntu:act-latest" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - name: build + publish (version 0.1.<run number>)
        env:
          UV_PUBLISH_USERNAME: benylin
          UV_PUBLISH_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          cp -r schemas packages/generator/src/atlas_gen/schemas
          uv version --package atlas-gen "0.1.${{ github.run_number }}"
          uv build --package atlas-gen --out-dir dist
          ./scripts/secret-scan.sh dist
          uv publish --publish-url https://git.clockmost.com/api/packages/benylin/pypi dist/*

  deploy:
    # image git.clockmost.com/benylin/atlas:<sha> -> tag bump in clockmost-infra
    # projects/atlas/compose.yaml -> the infra deploy loop rolls it out (shared WP-53 step)
    needs: [python, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - name: build, push, promote (shared deploy.sh, WP-53)
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
          INFRA_REPO_URL: ${{ secrets.INFRA_REPO_URL }}
          INFRA_KNOWN_HOSTS: ${{ secrets.INFRA_KNOWN_HOSTS }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: curl -fsSL https://git.clockmost.com/Benylin/ci-workflows/raw/branch/main/deploy.sh | bash -s -- atlas
