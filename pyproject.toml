[project]
name = "clockmost-atlas"
version = "0.1.0"
description = "clockmost atlas: the live, repo-generated map and home page of the lab"
requires-python = ">=3.15"
license = "MIT"

[tool.uv.workspace]
members = ["packages/generator", "packages/api"]

[tool.uv.sources]
atlas-gen = { workspace = true }
atlas-api = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pytest>=9.1",
    "httpx2",
    "ty>=0.0.95",
    "types-pyyaml>=6.0.12.20261030",
    "pytest-asyncio>=1.4.1",
]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "Q", "C4", "FAST", "N", "PT", "ERA", "D", "complex-structure", "S"]
ignore = [
    "undocumented-public-init",
    # From S, the rules that guess from a name or an import: on Meru's code they only raised false alarms.
    "assert",
    "hardcoded-bind-all-interfaces",
    "hardcoded-password-string",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# The template's "tests/**": a workspace keeps its tests under each package.
[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["D", "S", "unused-async"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/generator/tests", "packages/api/tests"]

# Not in the template: ruff doesn't look inside packages/*/src, so it needs telling what is ours.
[tool.ruff.lint.isort]
known-first-party = ["atlas_gen", "atlas_api"]

[tool.ty.environment]
python-version = "3.15"
