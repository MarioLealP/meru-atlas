# atlas's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: atlas
owner: mario
image:
  repository: zot.clockmost.com/meru/atlas
  digest: sha256:751e537e358b2ff439db62c8353cc962209b4ab36dfd614ec246b6c240bb8a08
  tag: "429b0cc60dab"
heartbeat:
  path: /healthz # the atlas's own health route, the one path its SSO guard leaves open
resources: # request size small (D34): the compose container had 192m
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
env:
  ATLAS_GRAPH_FILE: /data/atlas/graph.json
  ATLAS_DOCS_FILE: /data/atlas/docs.json.gz
  ATLAS_STATUS_FILE: /data/live/status.json
  ATLAS_THOTH_TOKEN_FILE: /var/run/meru/authentik/token # D104: its own Kubernetes token, no password
# The feeds (decision B, 2026-11-01): the host's clockmost-atlas-status pushes these ConfigMaps - status every minute,
# graph + docs when the infra repo's CI output changes. Read-only; the atlas never reaches the host.
configMaps:
  - name: atlas-map
    mountPath: /data/atlas
  - name: atlas-live
    mountPath: /data/live
# Who may connect (D97): the host side - Caddy, Gitea and Zabbix are still Docker containers, so their addresses,
# plus the node for the kubelet's probes - nothing in the cluster calls the atlas yet. Everything else in the cluster is refused. When Caddy and Gitea move
# into the cluster (D24) the Docker range goes for their namespaces.
networkPolicy:
  enabled: true
  fromNamespaces: []
# Its one credential (D92): a read-only Thoth login with its own Kubernetes token (D104) - Authentik grants
# atlas/atlas thoth.read in a protected blueprint (infra thoth.yaml). Nothing stored anywhere.
authentikLogin:
  enabled: true

# Crash reports (D125): this app's GlitchTip project, which Shikigami made (it predates the marker's own DSN line).
glitchtip:
  dsn: https://27b29ef0e754455cb93e32d928759f34@glitchtip.clockmost.com/5
