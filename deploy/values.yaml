# atlas's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: atlas
owner: mario
image:
  repository: zot.clockmost.com/meru/atlas
  digest: sha256:436cc3484042e4ca1ebc4459c2832e7f5b051f2252d5d83f5f8c88d32e168f14
  tag: "be024f82275c"
heartbeat:
  path: /healthz # the atlas's own health route, the one path its SSO guard leaves open
resources: # request size small (D34): the compose container had 192m
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
env:
  ATLAS_GRAPH_FILE: /data/atlas/graph.json
  ATLAS_DOCS_FILE: /data/atlas/docs.json.gz
  ATLAS_STATUS_FILE: /data/live/status.json
# The feeds (decision B, 2026-11-01): the host's clockmost-atlas-status pushes these ConfigMaps - status every minute,
# graph + docs when the infra repo's CI output changes. Read-only; the atlas never reaches the host.
configMaps:
  - name: atlas-map
    mountPath: /data/atlas
  - name: atlas-live
    mountPath: /data/live
